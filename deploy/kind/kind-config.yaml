# Phase 0 local cluster: single node, sized for laptop Docker VMs (a
# multi-node kind cluster destabilizes the control plane under 2 CPUs).
# The two replicas colocate here; the §1 two-worker topology is the
# Phase 1 GPU cluster. Pod anti-affinity in the Deployment is "preferred",
# so on any multi-node cluster the replicas spread one per node.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: chaosserve
nodes:
  - role: control-plane
    # Pinned by digest so the recorded pins.kubernetes.version (v1.30.0)
    # matches the cluster everywhere, including CI; the smoke suite
    # verifies the recorded pins against the live cluster.
    image: kindest/node:v1.30.0@sha256:047357ac0cfea04663786a612ba1eaba9702bef25227a794b52890dd8bcd692e
    # Host port 18000 -> NodePort 30800 (chaosserve-mock Service): the
    # e2e load path runs through real Service routing, no port-forward.
    extraPortMappings:
      - containerPort: 30800
        hostPort: 18000
