# Phase 0 mock deployment: two replicas behind one NodePort Service. The
# run config ConfigMap is created from configs/kind-e2e.yaml by the
# scripts (one file drives both sides); the mock reads its section only.
# No liveness probe: silent-hang must be able to blackhole /health without
# the kubelet restarting the pod out from under the experiment.
apiVersion: v1
kind: Namespace
metadata:
  name: chaosserve
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaosserve-mock
  namespace: chaosserve
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chaosserve-mock
  template:
    metadata:
      labels:
        app: chaosserve-mock
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: chaosserve-mock
                topologyKey: kubernetes.io/hostname
      containers:
        - name: mockserver
          image: chaosserve/mockserver:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          # Matches pins.readiness_probe in the run config.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: run-config
              mountPath: /etc/chaosserve
              readOnly: true
      volumes:
        - name: run-config
          configMap:
            name: chaosserve-run-config
---
apiVersion: v1
kind: Service
metadata:
  name: chaosserve-mock
  namespace: chaosserve
spec:
  type: NodePort
  selector:
    app: chaosserve-mock
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
