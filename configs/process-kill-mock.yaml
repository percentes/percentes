# Percentes process-kill e2e config: the process_kill variant end to end
# against one mock server in a Docker container under the on-failure
# restart policy, killed from the host and restarted in place. N=2 to bound
# continuous integration (CI) wall time. One file drives both the mock
# container and the host-side campaign runner.
schema_version: 1
profile: ac

run:
  name: percentes-process-kill-mock
  seed: 42
  repetitions: 2
  phases:
    warmup_s: 5
    baseline_s: 60
    fault_window_timeout_s: 90
    cooldown_s: 5

load:
  rate_rps: 20
  arrival_process: poisson
  input_length_tokens: 128
  max_tokens: 256
  ignore_eos: true
  unique_prefixes: true
  connections: 8

client:
  http_timeout_s: 30
  retries: 0
  placement:
    dedicated_node: false
    node_class: local
    zone: local
    subnet: local
    record_rtt: false

slo:
  ttft_ms: 1000
  e2e_ms: 14000
  sweep:
    ttft_ms: [800, 1000, 1500]
    e2e_ms: [12000, 14000, 18000]

histogram:
  unit: us
  lowest_discernible_value: 1
  highest_trackable_value: 600000000
  significant_figures: 3

recovery_detector:
  window_s: 10
  entry_pct: 90
  exit_pct: 85
  hold_s: 30
  sensitivity:
    entry_pct: [85, 90, 95]
    window_s: [5, 10, 20]
    hold_s: [15, 30, 60]

client_validity:
  send_skew_p99_ms: 5
  send_skew_max_ms: 50
  max_cpu_pct: 70
  cpu_window_s: 5
  go_gc_pause_p99_ms: 1

share_gate:
  min_pct: 45
  max_pct: 55

target:
  base_url: http://127.0.0.1:18000
  replicas: 1
  metrics_urls: [http://127.0.0.1:18000/metrics]
  queue_gauge: percentes_mock_requests_waiting

fault:
  variant: process_kill
  t_inject_offset_s: 60
  injection_tolerance_ms: 500
  endpoint_staleness_min_s: 20

pins:
  vllm:
    version: n/a-phase0-mock
    image_digest: n/a-phase0-mock
  model:
    name: n/a-phase0-mock
    revision: n/a-phase0-mock
    quantization: n/a-phase0-mock
  engine:
    kv_cache_gb: 0
    max_num_seqs: 0
    scheduler_settings: n/a-phase0-mock
    chunked_prefill: "off"
    cuda_graphs: "off"
    prefix_caching: "off"
    continuous_batching: "on"
  gpu:
    sku: n/a-phase0-mock
    driver: n/a-phase0-mock
    cuda: n/a-phase0-mock
    cudnn: n/a-phase0-mock
    nccl: n/a-phase0-mock
    clock_power_policy: n/a-phase0-mock
  kubernetes:
    version: none
    cni: none
    dataplane_mode: none
    kube_proxy_mode: none
    node_monitor_grace_period_s: 0
  readiness_probe:
    path: none
    period_s: 0
    timeout_s: 0
    failure_threshold: 0
  storage:
    weights_medium: n/a-phase0-mock
  container:
    runtime: docker (local)
    restart_policy: on-failure
    name: pct-mock
    compile_cache: none (mock)
    hf_hub_offline: n/a (mock)

mock:
  listen_addr: ":8000"
  seed: 42
  ttft:
    distribution: fixed
    fixed_ms: 200
  itl:
    distribution: fixed
    fixed_ms: 10
  slow_reload:
    enabled: true
    duration_s: 15
  serve_health_during_silent_hang: false
  # No scheduled faults: the process-kill injector kills the server
  # process at T_inject.
